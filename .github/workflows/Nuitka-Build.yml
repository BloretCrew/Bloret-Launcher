name: 应用程序打包 - Nuitka

permissions:
  contents: write

on:
  release:
    types: [prereleased]
  workflow_dispatch:

jobs:
  Build-All:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Bloret-Launcher
          - os: ubuntu-latest
            artifact: Bloret-Launcher-Linux
          # - os: macos-15-intel
          #   artifact: Bloret-Launcher-MacOS-Intel
          # - os: macos-latest
          #   artifact: Bloret-Launcher-MacOS-ARM
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: '3.10'
      OUTPUT_DIR: 'output'
    steps:
    - name: 检出最新版本（含子模块）
      uses: actions/checkout@v4
      with:
        ref: ${{ runner.os == 'Windows' && 'Windows' || github.ref }}
        submodules: true

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        # 安装兼容版本的 setuptools，避免与 Nuitka 内部 jinja2 的冲突
        # setuptools >= 75.8.1 required for sip 6.15.1
        # setuptools < 80 recommended for Nuitka compatibility
        python -m pip install "setuptools>=75.8.1,<80"
        # 确保使用最新版 Nuitka 以获得最佳兼容性
        python -m pip install --upgrade nuitka
        pip install pillow zstandard ordered-set
        if [ "${{ runner.os }}" == "Linux" ]; then sudo apt-get update && sudo apt-get install -y fuse libfuse2 patchelf; fi
        if [ "${{ runner.os }}" == "macOS" ]; then
          brew list openssl@3 &>/dev/null || brew install openssl@3
          brew list ccache &>/dev/null || brew install ccache
        fi
      shell: bash

    - name: 下载平台专属 EasyTier
      run: |
        EASYTIER_VERSION="v2.6.4"
        ARCH=$(uname -m)
        case "${{ runner.os }}" in
          Windows)
            EASYTIER_ZIP="easytier-windows-x86_64-${EASYTIER_VERSION}.zip"
            ;;
          Linux)
            if [ "$ARCH" = "x86_64" ]; then
              EASYTIER_ZIP="easytier-linux-x86_64-${EASYTIER_VERSION}.zip"
            elif [ "$ARCH" = "aarch64" ]; then
              EASYTIER_ZIP="easytier-linux-aarch64-${EASYTIER_VERSION}.zip"
            fi
            ;;
          macOS)
            if [ "$ARCH" = "x86_64" ]; then
              EASYTIER_ZIP="easytier-macos-x86_64-${EASYTIER_VERSION}.zip"
            elif [ "$ARCH" = "arm64" ]; then
              EASYTIER_ZIP="easytier-macos-aarch64-${EASYTIER_VERSION}.zip"
            fi
            ;;
        esac

        if [ -n "$EASYTIER_ZIP" ]; then
          rm -rf easytier
          mkdir -p easytier
          # 优先使用 gh CLI 下载（自带重试），失败则回退到 curl
          if command -v gh &>/dev/null; then
            gh release download "$EASYTIER_VERSION" -R "EasyTier/EasyTier" -p "$EASYTIER_ZIP" || \
              curl -L --retry 3 --retry-delay 5 -o "$EASYTIER_ZIP" "https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_VERSION}/${EASYTIER_ZIP}"
          else
            curl -L --retry 3 --retry-delay 5 -o "$EASYTIER_ZIP" "https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_VERSION}/${EASYTIER_ZIP}"
          fi
          # 验证下载的文件是有效的 zip
          if ! unzip -t "$EASYTIER_ZIP" &>/dev/null; then
            echo "::error::EasyTier download failed: invalid zip file"
            exit 1
          fi
          unzip -o "$EASYTIER_ZIP" -d easytier-tmp
          find easytier-tmp -name "easytier-core*" -exec cp {} easytier/ \;
          find easytier-tmp -name "easytier-cli*" -exec cp {} easytier/ \;
          chmod +x easytier/easytier-core* easytier/easytier-cli* 2>/dev/null || true
          rm -rf easytier-tmp "$EASYTIER_ZIP"
          echo "EasyTier for ${{ runner.os }} ($ARCH) ready"
        else
          echo "No EasyTier binary available for ${{ runner.os }} ($ARCH), skipping"
        fi
      shell: bash

    - name: 使用 Nuitka 打包 (Windows)
      if: runner.os == 'Windows'
      run: |
        $EASYTIER_ARG = if (Test-Path "easytier") { "--include-data-dir=easytier=easytier" } else { "" }
        python -m nuitka `
          --standalone --onefile `
          --windows-console-mode=disable `
          --windows-icon-from-ico=bloret.ico `
          --output-file=Bloret-Launcher.exe `
          --windows-company-name="Bloret" `
          --windows-product-name="Bloret Launcher" `
          --windows-file-version=1.0.0 `
          --windows-product-version=1.0.0 `
          --assume-yes-for-downloads `
          --enable-plugin=tk-inter `
          --enable-plugin=pyside6 `
          --include-qt-plugins=sensible,styles,qml `
          --include-data-dir=qml=qml `
          --include-data-dir=RinUI=RinUI `
          --include-data-dir=icon=icon `
          --include-data-dir=lang=lang `
          --include-data-files=bloret.ico=bloret.ico `
          --include-data-files=Bloret-Fluent.png=Bloret-Fluent.png `
          --include-data-files=config.json=config.json `
          --include-data-files=LICENSE=LICENSE `
          $EASYTIER_ARG `
          --include-data-dir=modules=modules `
          Bloret-Launcher.py
      shell: pwsh

    - name: 使用 Nuitka 打包 (Linux)
      if: runner.os == 'Linux'
      run: |
        EASYTIER_ARG=""
        if [ -d "easytier" ]; then EASYTIER_ARG="--include-data-dir=easytier=easytier"; fi
        python -m nuitka --standalone --onefile --enable-plugin=pyside6 --include-qt-plugins=sensible,qml --include-data-dir=qml=qml --include-data-dir=RinUI=RinUI --include-data-dir=icon=icon --include-data-dir=lang=lang --include-data-files=Bloret.png=Bloret.png --include-data-files=Bloret-Fluent.png=Bloret-Fluent.png $EASYTIER_ARG --include-data-dir=modules=modules --output-file=Bloret-Launcher Bloret-Launcher.py
      shell: bash

    - name: 修复 OpenSSL 依赖 (macOS)
      if: runner.os == 'macOS'
      run: |
        # 定位 Python 的 lib-dynload 目录
        PYTHON_STDLIB=$(python -c "import sysconfig; print(sysconfig.get_path('stdlib'))")
        DYNLOAD_PATH="$PYTHON_STDLIB/lib-dynload"
        echo "Python lib-dynload path: $DYNLOAD_PATH"
        
        # 获取 Homebrew OpenSSL 路径
        OPENSSL_PREFIX=$(brew --prefix openssl@3)
        LIBSSL="$OPENSSL_PREFIX/lib/libssl.3.dylib"
        LIBCRYPTO="$OPENSSL_PREFIX/lib/libcrypto.3.dylib"
        echo "OpenSSL prefix: $OPENSSL_PREFIX"
        
        if [ ! -f "$LIBSSL" ]; then
            echo "Error: libssl.3.dylib not found at $LIBSSL"
            exit 1
        fi

        # 复制库文件到 lib-dynload
        echo "Copying OpenSSL libs to $DYNLOAD_PATH"
        cp "$LIBSSL" "$DYNLOAD_PATH/"
        cp "$LIBCRYPTO" "$DYNLOAD_PATH/"
        
        # 修改库的权限以便修改（默认可能是只读）
        chmod u+w "$DYNLOAD_PATH/libssl.3.dylib" "$DYNLOAD_PATH/libcrypto.3.dylib"
        
        # 定义 patch 函数
        patch_lib() {
            local target=$1
            local libssl_name="libssl.3.dylib"
            local libcrypto_name="libcrypto.3.dylib"
            
            if [ -f "$target" ]; then
                echo "Patching $target..."
                # 修改权限
                sudo chmod u+w "$target"
                
                # 修改依赖路径为 @loader_path (即当前目录)
                # 注意：原始路径可能是 /usr/local/opt/openssl@3/lib/libssl.3.dylib 或类似
                # 我们尝试查找并替换所有指向 Homebrew OpenSSL 的引用
                
                # 获取当前依赖
                otool -L "$target"
                
                sudo install_name_tool -change "$LIBSSL" "@loader_path/$libssl_name" "$target"
                sudo install_name_tool -change "$LIBCRYPTO" "@loader_path/$libcrypto_name" "$target"
                
                echo "Patched:"
                otool -L "$target" | grep "openssl" || true
            else
                echo "Warning: Target $target not found, skipping."
            fi
        }

        # Patch _hashlib.so
        HASHLIB=$(find "$DYNLOAD_PATH" -name "_hashlib*.so" | head -n 1)
        patch_lib "$HASHLIB"
        
        # Patch _ssl.so
        SSL_MOD=$(find "$DYNLOAD_PATH" -name "_ssl*.so" | head -n 1)
        patch_lib "$SSL_MOD"
        
        # Patch libssl.3.dylib 本身可能依赖 libcrypto.3.dylib
        TARGET_LIBSSL="$DYNLOAD_PATH/libssl.3.dylib"
        patch_lib "$TARGET_LIBSSL"
        
        echo "Dependency patch completed."
      shell: bash

    - name: 使用 Nuitka 打包 (macOS)
      if: runner.os == 'macOS'
      run: |
        # 避免使用 Homebrew 的 OpenSSL，使用 Python 内建或系统库
        unset OPENSSL_DIR
        unset LDFLAGS
        unset CPPFLAGS
        unset DYLD_FALLBACK_LIBRARY_PATH
        unset PKG_CONFIG_PATH
        
        echo "=== Environment Info ==="
        echo "Checking _hashlib linkage:"
        otool -L $(python -c "import _hashlib; print(_hashlib.__file__)") || echo "Failed to check _hashlib linkage"
        echo "========================"

        # 尝试转换图标格式 (png -> icns)
        ICON_CMD=""
        # 修正图标源路径
        ICON_SOURCE=""
        if [ -f "Bloret-Fluent.png" ]; then
          ICON_SOURCE="Bloret-Fluent.png"
        elif [ -f "img/BL.png" ]; then
          ICON_SOURCE="img/BL.png"
        fi

        if [ ! -z "$ICON_SOURCE" ]; then
          mkdir -p build_assets/Bloret.iconset
          for size in 16 32 128 256 512; do
            # 计算 80% 的尺寸用于内容，其余为留白
            content_size=$(python3 -c "print(int($size * 0.8))")
            sips -z $content_size $content_size $ICON_SOURCE --out temp_content.png
            # 正常尺寸
            sips -p $size $size temp_content.png --out build_assets/Bloret.iconset/icon_${size}x${size}.png
            # @2x 尺寸
            double_size=$(($size * 2))
            double_content_size=$(python3 -c "print(int($double_size * 0.8))")
            sips -z $double_content_size $double_content_size $ICON_SOURCE --out temp_content_2x.png
            sips -p $double_size $double_size temp_content_2x.png --out build_assets/Bloret.iconset/icon_${size}x${size}@2x.png
          done
          rm temp_content.png temp_content_2x.png
          if iconutil -c icns build_assets/Bloret.iconset -o build_assets/icon.icns; then
             ICON_CMD="--macos-app-icon=build_assets/icon.icns"
          fi
        fi

        EASYTIER_ARG=""
        if [ -d "easytier" ] && [ "$(ls -A easytier)" ]; then EASYTIER_ARG="--include-data-dir=easytier=easytier"; fi

        # OpenSSL 依赖通过上面的环境变量配置处理
        python -m nuitka --standalone --macos-create-app-bundle --macos-app-name="Bloret Launcher" $ICON_CMD --enable-plugin=pyside6 --include-qt-plugins=sensible,styles,qml --include-data-dir=qml=qml --include-data-dir=RinUI=RinUI --include-data-dir=icon=icon --include-data-dir=lang=lang $EASYTIER_ARG --include-data-dir=modules=modules --noinclude-dlls='libssl*' --noinclude-dlls='libcrypto*' --noinclude-dlls='*/libssl.*' --noinclude-dlls='*/libcrypto.*' --static-libpython=no Bloret-Launcher.py

        # 生成 DMG 文件
        brew install create-dmg
        
        # 获取架构名称
        ARCH=$(uname -m)
        if [ "$ARCH" == "x86_64" ]; then
          DMG_NAME="Bloret-Launcher-macOS-Intel.dmg"
        else
          DMG_NAME="Bloret-Launcher-macOS-arm.dmg"
        fi

        # 创建简单的背景图 (可选，如果 Pillow 可用)
        python3 -c "from PIL import Image, ImageDraw; img = Image.new('RGB', (600, 400), (240, 240, 240)); draw = ImageDraw.Draw(img); draw.polygon([(250, 200), (350, 200), (350, 150), (450, 250), (350, 350), (350, 300), (250, 300)], fill=(100, 100, 100)); img.save('dmg_bg.png')" || true

        rm -f "$DMG_NAME"
        create-dmg \
          --volname "Bloret Launcher" \
          --volicon "build_assets/icon.icns" \
          --background "dmg_bg.png" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --hide-extension "Bloret Launcher.app" \
          --app-drop-link 450 250 \
          "$DMG_NAME" \
          "Bloret Launcher.app/"
      shell: bash

    - name: 收集产物
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        if [ "${{ runner.os }}" == "Windows" ]; then 
          cp Bloret-Launcher.exe ${{ env.OUTPUT_DIR }}/
        fi
        if [ "${{ runner.os }}" == "Linux" ]; then 
          ARCH=$(uname -m)
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/bloret-launcher
          cp Bloret-Launcher AppDir/usr/bin/bloret-launcher
          chmod +x AppDir/usr/bin/bloret-launcher
          cp -r qml RinUI icon lang config.json LICENSE bloret.ico Bloret.png Bloret-Fluent.png JavaWrapper.jar AppDir/usr/share/bloret-launcher/
          if [ -d "easytier" ]; then cp -r easytier AppDir/usr/share/bloret-launcher/; fi
          cp servers.dat AppDir/usr/share/bloret-launcher/ || true
          cat > AppDir/bloret-launcher.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=Bloret Launcher
        GenericName=Minecraft
        Comment=A Minecraft Launcher designed by BloretValley administrator.
        Exec=bloret-launcher
        Icon=bloret-launcher
        Terminal=false
        Categories=Game;
        EOF
          cp AppDir/bloret-launcher.desktop AppDir/usr/share/applications/bloret-launcher.desktop
          if [ -f "Bloret-Fluent.png" ]; then
            cp Bloret-Fluent.png AppDir/bloret-launcher.png
          elif [ -f "img/BL.png" ]; then
            cp img/BL.png AppDir/bloret-launcher.png
          else
            python -c "from PIL import Image; Image.open('bloret.ico').save('AppDir/bloret-launcher.png')"
          fi
          cp AppDir/bloret-launcher.png AppDir/.DirIcon
          curl -L -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "${{ env.OUTPUT_DIR }}/Bloret-Launcher-Linux.AppImage"
        fi
        if [ "${{ runner.os }}" == "macOS" ]; then 
          cp *.dmg ${{ env.OUTPUT_DIR }}/
        fi
        cp -r qml RinUI icon lang config.json LICENSE bloret.ico JavaWrapper.jar ${{ env.OUTPUT_DIR }}/
        if [ -d "easytier" ]; then cp -r easytier ${{ env.OUTPUT_DIR }}/; fi
        cp servers.dat ${{ env.OUTPUT_DIR }}/ || true
      shell: bash

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: "${{ env.OUTPUT_DIR }}/"

  Upload-To-Release:
    # 仅在 release 事件时运行，不在 workflow_dispatch 时运行
    if: github.event_name == 'release'
    needs: [Build-All, Build-Setup]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher
          path: Bloret-Launcher-Windows

      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-Linux
          path: Bloret-Launcher-Linux

      # - name: 下载 MacOS Intel 构建产物
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: Bloret-Launcher-MacOS-Intel
      #     path: Bloret-Launcher-MacOS-Intel

      - name: 下载 MacOS ARM 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-MacOS-ARM
          path: Bloret-Launcher-MacOS-ARM

      - name: 下载安装程序
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-Setup

      - name: 整理发布文件
        run: |
          mkdir -p release_assets
          cp Bloret-Launcher-Windows/Bloret-Launcher.exe release_assets/
          cp Bloret-Launcher-Linux/*.AppImage release_assets/
          # cp Bloret-Launcher-MacOS-Intel/*.dmg release_assets/ || true
          cp Bloret-Launcher-MacOS-ARM/*.dmg release_assets/ || true
          cp Bloret-Launcher-Setup.exe release_assets/

      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Code-Package:
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v4
      with:
        ref: 'Windows'

    - name: 创建输出目录并清理
      run: |
        # 强制创建目录并清理旧内容
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: 复制所有文件（排除 .git 和 output）
      run: |
        # 递归复制所有文件到 output 目录，排除 .git 和 output 目录
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output")
        # 确保 LICENSE 文件被复制
        if (Test-Path "LICENSE") {
          Copy-Item -Path "LICENSE" -Destination "output\"
        } else {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 创建压缩包
      run: |
        # 直接压缩 output 目录内容为 Code-Package.zip
        Compress-Archive -Path "output/*" -DestinationPath "output/Code-Package.zip" -Force
      shell: pwsh

    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: Code-Package
        path: "output/Code-Package.zip"
  Build-Setup:
    needs: Build-All
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v4
      with:
        ref: 'Windows'

    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: Bloret-Launcher
        path: output

    - name: 确保 LICENSE 文件存在
      run: |
        if (-not (Test-Path "output/LICENSE")) {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 展示完整文件夹目录
      run: |
        Write-Host "当前文件夹目录结构如下："
        Get-ChildItem -Path "output" -Recurse | Format-Table -AutoSize
      shell: pwsh

    - name: 设置系统语言为简体中文
      run: |
        Set-WinSystemLocale -SystemLocale zh-CN
        Write-Host "系统语言已设置为简体中文"
      shell: pwsh

    - name: 安装 Inno Setup
      run: |
        choco install innosetup --yes
      shell: pwsh

    - name: 运行 Inno Setup 构建安装程序
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Bloret-Launcher-Setup.iss"
      shell: pwsh

    - name: 上传安装程序
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-Setup
        path: "./output/Bloret-Launcher-Setup.exe"

    # - name: 更新为测试版
    #   run: |
    #     # 从GitHub事件中提取版本信息
    #     VERSION="${{ github.event.release.tag_name }}"
    #     VERSION_NAME="${{ github.event.release.name }}"
    #     DESCRIPTION=${{ toJSON(github.event.release.body) }}
    #     
    #     # 调用API更新为测试版
    #     curl -X POST https://launcher.bloret.net/api/newversion/github \
    #       -H "Content-Type: application/json" \
    #       -d "{\"key\":\"${{ secrets.BLORET_LAUNCHER_WEBSITE }}\",\"beta\":true,\"version\":\"$VERSION\",\"versionName\":\"$VERSION_NAME\",\"description\":$DESCRIPTION}"
    #   shell: bash
