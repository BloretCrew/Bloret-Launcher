name: 应用程序打包 - Nuitka

permissions:
  contents: write

on:
  release:
    types: [prereleased]
  workflow_dispatch:

jobs:
  Build-All:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Bloret-Launcher
          - os: ubuntu-latest
            artifact: Bloret-Launcher-Linux
          - os: macos-13
            artifact: Bloret-Launcher-MacOS-Intel
          - os: macos-latest
            artifact: Bloret-Launcher-MacOS-ARM
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: '3.10'
      OUTPUT_DIR: 'output'
    steps:
    - name: 检出最新版本
      uses: actions/checkout@v4
      with:
        ref: ${{ runner.os == 'Windows' && 'Windows' || github.ref }}

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip wheel
        pip install -r requirements.txt
        # 安装兼容版本的 setuptools，避免与 Nuitka 内部 jinja2 的冲突
        python -m pip install "setuptools<70"
        # 确保使用最新版 Nuitka 以获得最佳兼容性
        python -m pip install --upgrade nuitka
        pip install pillow zstandard ordered-set
        if [ "${{ runner.os }}" == "Linux" ]; then sudo apt-get update && sudo apt-get install -y fuse libfuse2 patchelf; fi
        if [ "${{ runner.os }}" == "macOS" ]; then
          brew list openssl@3 &>/dev/null || brew install openssl@3
          brew list ccache &>/dev/null || brew install ccache
        fi
      shell: bash

    - name: 使用 Nuitka 打包 (Windows)
      if: runner.os == 'Windows'
      run: |
        $EASYTIER_ARG = if (Test-Path "easytier") { "--include-data-dir=easytier=easytier" } else { "" }
        python -m nuitka --standalone --onefile --windows-console-mode=disable --enable-plugin=tk-inter --enable-plugin=pyqt5 --include-qt-plugins=sensible,styles --windows-icon-from-ico=bloret.ico --output-file=Bloret-Launcher.exe --assume-yes-for-downloads --windows-company-name="Bloret" --windows-product-name="Bloret Launcher" --windows-file-version=1.0.0 --windows-product-version=1.0.0 --include-data-dir=ui=ui --include-data-dir=lang=lang $EASYTIER_ARG --include-data-dir=modules=modules Bloret-Launcher.py
      shell: pwsh

    - name: 使用 Nuitka 打包 (Linux)
      if: runner.os == 'Linux'
      run: |
        EASYTIER_ARG=""
        if [ -d "easytier" ]; then EASYTIER_ARG="--include-data-dir=easytier=easytier"; fi
        python -m nuitka --standalone --onefile --enable-plugin=pyqt5 --include-qt-plugins=sensible --include-data-dir=ui=ui --include-data-dir=lang=lang $EASYTIER_ARG --include-data-dir=modules=modules --output-file=Bloret-Launcher Bloret-Launcher.py
      shell: bash

    - name: 使用 Nuitka 打包 (macOS)
      if: runner.os == 'macOS'
      run: |
        # 修复 OpenSSL 依赖扫描问题
        OPENSSL_SEARCH_ARG=""
        if [ -d "/usr/local/opt/openssl@3" ]; then
          OPENSSL_DIR="/usr/local/opt/openssl@3"
        elif [ -d "/opt/homebrew/opt/openssl@3" ]; then
          OPENSSL_DIR="/opt/homebrew/opt/openssl@3"
        fi

        if [ ! -z "$OPENSSL_DIR" ]; then
          export LDFLAGS="-L$OPENSSL_DIR/lib"
          export CPPFLAGS="-I$OPENSSL_DIR/include"
          export PKG_CONFIG_PATH="$OPENSSL_DIR/lib/pkgconfig"
          # 使用 DYLD_FALLBACK_LIBRARY_PATH 代替 DYLD_LIBRARY_PATH，避免干扰系统工具的依赖解析
          # 添加更多标准库路径确保系统库能被正确找到
          export DYLD_FALLBACK_LIBRARY_PATH="$OPENSSL_DIR/lib:/usr/local/lib:/opt/homebrew/lib:/usr/lib:$DYLD_FALLBACK_LIBRARY_PATH"
        fi

        # 尝试转换图标格式 (png -> icns)
        ICON_CMD=""
        # 修正图标源路径
        ICON_SOURCE=""
        if [ -f "img/BL.png" ]; then
          ICON_SOURCE="img/BL.png"
        elif [ -f "Bloret-Fluent.png" ]; then
          ICON_SOURCE="Bloret-Fluent.png"
        fi

        if [ ! -z "$ICON_SOURCE" ]; then
          mkdir -p build_assets/Bloret.iconset
          sips -z 16 16     $ICON_SOURCE --out build_assets/Bloret.iconset/icon_16x16.png
          sips -z 32 32     $ICON_SOURCE --out build_assets/Bloret.iconset/icon_16x16@2x.png
          sips -z 32 32     $ICON_SOURCE --out build_assets/Bloret.iconset/icon_32x32.png
          sips -z 64 64     $ICON_SOURCE --out build_assets/Bloret.iconset/icon_32x32@2x.png
          sips -z 128 128   $ICON_SOURCE --out build_assets/Bloret.iconset/icon_128x128.png
          sips -z 256 256   $ICON_SOURCE --out build_assets/Bloret.iconset/icon_128x128@2x.png
          sips -z 256 256   $ICON_SOURCE --out build_assets/Bloret.iconset/icon_256x256.png
          sips -z 512 512   $ICON_SOURCE --out build_assets/Bloret.iconset/icon_256x256@2x.png
          sips -z 512 512   $ICON_SOURCE --out build_assets/Bloret.iconset/icon_512x512.png
          sips -z 1024 1024 $ICON_SOURCE --out build_assets/Bloret.iconset/icon_512x512@2x.png
          if iconutil -c icns build_assets/Bloret.iconset -o build_assets/icon.icns; then
             ICON_CMD="--macos-app-icon=build_assets/icon.icns"
          fi
        fi

        EASYTIER_ARG=""
        if [ -d "easytier" ] && [ "$(ls -A easytier)" ]; then EASYTIER_ARG="--include-data-dir=easytier=easytier"; fi

        # OpenSSL 依赖通过上面的环境变量配置处理
        # 更严格的排除规则，防止 Nuitka 尝试包含 OpenSSL 等系统库
        # 添加 --static-libpython=no 参数减少链接问题
        python -m nuitka --standalone --macos-create-app-bundle $ICON_CMD --enable-plugin=pyqt5 --include-qt-plugins=sensible,styles --include-data-dir=ui=ui --include-data-dir=lang=lang $EASYTIER_ARG --include-data-dir=modules=modules --noinclude-dlls='libssl*' --noinclude-dlls='libcrypto*' --noinclude-dlls='*/libssl.*' --noinclude-dlls='*/libcrypto.*' --static-libpython=no --output-file=Bloret-Launcher.app Bloret-Launcher.py
      shell: bash

    - name: 收集产物
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        if [ "${{ runner.os }}" == "Windows" ]; then cp Bloret-Launcher.exe ${{ env.OUTPUT_DIR }}/; fi
        if [ "${{ runner.os }}" == "Linux" ]; then cp Bloret-Launcher ${{ env.OUTPUT_DIR }}/; fi
        if [ "${{ runner.os }}" == "macOS" ]; then cp -r Bloret-Launcher.app ${{ env.OUTPUT_DIR }}/; fi
        cp -r ui lang config.json LICENSE bloret.ico JavaWrapper.jar ${{ env.OUTPUT_DIR }}/
        if [ -d "easytier" ]; then cp -r easytier ${{ env.OUTPUT_DIR }}/; fi
        cp servers.dat ${{ env.OUTPUT_DIR }}/ || true
      shell: bash

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: "${{ env.OUTPUT_DIR }}/"

  Upload-To-Release:
    # 仅在 release 事件时运行，不在 workflow_dispatch 时运行
    if: github.event_name == 'release'
    needs: [Build-All, Build-Setup]
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher
          path: Bloret-Launcher-Windows

      - name: 下载 Linux 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-Linux
          path: Bloret-Launcher-Linux

      - name: 下载 MacOS Intel 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-MacOS-Intel
          path: Bloret-Launcher-MacOS-Intel

      - name: 下载 MacOS ARM 构建产物
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-MacOS-ARM
          path: Bloret-Launcher-MacOS-ARM

      - name: 下载安装程序
        uses: actions/download-artifact@v4
        with:
          name: Bloret-Launcher-Setup

      - name: 创建发布压缩包
        run: |
          zip -r Bloret-Launcher-Windows.zip Bloret-Launcher-Windows/*
          zip -r Bloret-Launcher-Linux.zip Bloret-Launcher-Linux/*
          zip -r Bloret-Launcher-MacOS-Intel.zip Bloret-Launcher-MacOS-Intel/*
          zip -r Bloret-Launcher-MacOS-ARM.zip Bloret-Launcher-MacOS-ARM/*

      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Bloret-Launcher-Windows.zip
            Bloret-Launcher-Linux.zip
            Bloret-Launcher-MacOS-Intel.zip
            Bloret-Launcher-MacOS-ARM.zip
            Bloret-Launcher-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  Code-Package:
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v4
      with:
        ref: 'Windows'

    - name: 创建输出目录并清理
      run: |
        # 强制创建目录并清理旧内容
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: 复制所有文件（排除 .git 和 output）
      run: |
        # 递归复制所有文件到 output 目录，排除 .git 和 output 目录
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output")
        # 确保 LICENSE 文件被复制
        if (Test-Path "LICENSE") {
          Copy-Item -Path "LICENSE" -Destination "output\"
        } else {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 创建压缩包
      run: |
        # 直接压缩 output 目录内容为 Code-Package.zip
        Compress-Archive -Path "output/*" -DestinationPath "output/Code-Package.zip" -Force
      shell: pwsh

    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: Code-Package
        path: "output/Code-Package.zip"
  Build-Setup:
    needs: Build-All
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v4
      with:
        ref: 'Windows'

    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: Bloret-Launcher
        path: output

    - name: 确保 LICENSE 文件存在
      run: |
        if (-not (Test-Path "output/LICENSE")) {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 展示完整文件夹目录
      run: |
        Write-Host "当前文件夹目录结构如下："
        Get-ChildItem -Path "output" -Recurse | Format-Table -AutoSize
      shell: pwsh

    - name: 设置系统语言为简体中文
      run: |
        Set-WinSystemLocale -SystemLocale zh-CN
        Write-Host "系统语言已设置为简体中文"
      shell: pwsh

    - name: 安装 Inno Setup
      run: |
        choco install innosetup --yes
      shell: pwsh

    - name: 运行 Inno Setup 构建安装程序
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Bloret-Launcher-Setup.iss"
      shell: pwsh

    - name: 上传安装程序
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-Setup
        path: "./output/Bloret-Launcher-Setup.exe"

