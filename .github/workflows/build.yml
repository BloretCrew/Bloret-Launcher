name: 应用程序打包

permissions:
  contents: write

on:
  push:
    branches:
      - Windows

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Bloret-Launcher-Windows.zip'

    steps:
    - name: 检出代码
      uses: actions/checkout@v2

    - name: 验证资源文件路径
      run: |
        Get-ChildItem -Path .
        if (-not (Test-Path "icons/bloret.png")) { Write-Host "icons/bloret.png not found"; exit 1 }
        if (-not (Test-Path "config.json")) { Write-Host "config.json not found"; exit 1 }
        if (-not (Test-Path "ui")) { Write-Host "ui directory not found"; exit 1 }
        if (-not (Test-Path "cmcl.json")) { Write-Host "cmcl.json not found"; exit 1 }
        if (-not (Test-Path "cmcl.exe")) { Write-Host "cmcl.exe not found"; exit 1 }
        if (-not (Test-Path "cmcl.blank.json")) { Write-Host "cmcl.blank.json not found"; exit 1 }
      shell: pwsh

    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 安装程序依赖和打包依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pillow
        pip install pyinstaller

    - name: 将 PNG 图标转换为 ICO
      run: |
        python -c "
        from PIL import Image
        img = Image.open('icons/bloret.png')
        img.save('icons/bloret.ico', format='ICO')
        "

    - name: 验证转换后的 ICO 文件路径
      run: |
        if (-not (Test-Path "icons/bloret.ico")) { exit 1 }
      shell: pwsh

    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --noconsole --icon=icons/bloret.ico --name=Bloret-Launcher `
          --add-data "icons\\bloret.ico;." `
          --add-data "config.json;." `
          --add-data "ui;ui" `
          --add-data "cmcl.json;." `
          --add-data "cmcl.exe;." `
          --add-data "cmcl.blank.json;." `
          --hidden-import=sip `
          --hidden-import=qfluentwidgets `
          --hidden-import=win10toast `
          --paths=. `
          Bloret-Launcher.py
      shell: pwsh

    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Bloret-Launcher.exe ${{ env.OUTPUT_DIR }}/
        cp -r icons/ ${{ env.OUTPUT_DIR }}/
        cp -r ui/ ${{ env.OUTPUT_DIR }}/
        cp -r cmcl.exe ${{ env.OUTPUT_DIR }}/
        cp -r cmcl.json ${{ env.OUTPUT_DIR }}/
        cp -r cmcl.blank.json ${{ env.OUTPUT_DIR }}/
        cp -r config.json ${{ env.OUTPUT_DIR }}/
        cp -r LICENSE ${{ env.OUTPUT_DIR }}/
        cp -r servers.dat ${{ env.OUTPUT_DIR }}/
        cp -r cmcl_save.json ${{ env.OUTPUT_DIR }}/

    - name: 清理旧压缩包
      run: |
        if (Test-Path "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}") {
          Remove-Item "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
        }
      shell: pwsh

    - name: 创建压缩包
      run: Compress-Archive -Path "${{ env.OUTPUT_DIR }}/*" -DestinationPath "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
      shell: pwsh

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher
        path: "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
  code-package:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v2

    - name: 创建输出目录并清理
      run: |
        # 强制创建目录并清理旧内容
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: 复制所有文件（排除 .git 和 output）
      run: |
        # 递归复制所有文件到 output 目录，排除 .git 和 output 目录
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output")
      shell: pwsh

    - name: 创建压缩包
      run: |
        # 直接压缩 output 目录内容为 package.zip
        Compress-Archive -Path "output/*" -DestinationPath "output/package.zip" -Force
      shell: pwsh

    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: "output/package.zip"
  release:
    needs: [build, code-package]
    runs-on: windows-latest
    env:
      OUTPUT_DIR: 'output'  # 定义 OUTPUT_DIR 环境变量
      ARTIFACT_NAME: 'Bloret-Launcher-Windows.zip'  # 定义 ARTIFACT_NAME 环境变量
    steps:
    - name: 检出代码
      uses: actions/checkout@v2

    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: Bloret-Launcher
        path: ${{ env.OUTPUT_DIR }}
        
    - name: 检查 Bloret-Launcher.zip 是否存在
      run: |
        if (-not (Test-Path "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}")) {
          Write-Host "${{ env.ARTIFACT_NAME }} not found"
          exit 1
        }
      shell: pwsh

    - name: 编辑最新预发布版本
      id: edit_release
      uses: actions/github-script@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          // 读取 release.md 文件内容
          const releaseNotesPath = path.join(process.env.GITHUB_WORKSPACE, '.github/workflows/release.md');
          if (!fs.existsSync(releaseNotesPath)) {
            throw new Error('release.md 文件未找到');
          }
          const releaseNotes = fs.readFileSync(releaseNotesPath, 'utf8');

          // 添加代码改动记录
          const changeLog = `
          ## 代码改动记录
          - 替换编辑最新预发布版本的内容为 release.md 文件内容
          - 移除原有附件
          `;
          const updatedNotes = `${releaseNotes}\n\n${changeLog}`;

          // 获取最新的预发布版本
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 1
          });

          if (releases.length > 0) {
            const latestRelease = releases[0];
            console.log('Found latest prerelease:', latestRelease);

            // 更新预发布版本
            const updatedRelease = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: latestRelease.id,
              body: updatedNotes,
              draft: false,
              prerelease: true
            });
            console.log('Updated release:', updatedRelease);

            // 确保生成 upload_url.txt 文件
            const filePath = path.join(process.env.GITHUB_WORKSPACE, 'upload_url.txt');
            fs.writeFileSync(filePath, updatedRelease.data.upload_url);
          } else {
            throw new Error('No prerelease found to edit');
          }

    - name: 检查 upload_url.txt 是否存在并验证内容
      run: |
        if (-not (Test-Path "upload_url.txt")) {
          Write-Host "upload_url.txt 文件未找到"
          exit 1
        }
        $uploadUrl = Get-Content -Path "upload_url.txt" -Raw
        if (-not $uploadUrl) {
          Write-Host "upload_url.txt 内容为空"
          exit 1
        }
      shell: pwsh

    - name: 设置上传 URL 环境变量
      id: set_upload_url
      run: |
        $uploadUrl = Get-Content -Path "upload_url.txt" -Raw
        Add-Content -Path $env:GITHUB_ENV -Value "UPLOAD_URL=$uploadUrl"
      shell: pwsh

    - name: 检查上传 URL 是否有效
      run: |
        if (-not "${{ env.UPLOAD_URL }}") {
          Write-Host "UPLOAD_URL 未正确设置"
          exit 1
        }
      shell: pwsh

    - name: 检查构建产物是否存在
      run: |
        if (-not (Test-Path "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}")) {
          Write-Host "构建产物未找到: ${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
          exit 1
        }
      shell: pwsh

    - name: 删除同名资产（如果存在）
      uses: actions/github-script@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        script: |
          const assetName = '${{ env.ARTIFACT_NAME }}';
          const { data: releases } = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 1
          });

          if (releases.length > 0) {
            const latestRelease = releases[0];
            const existingAsset = latestRelease.assets.find(asset => asset.name === assetName);
            if (existingAsset) {
              console.log(`Deleting existing asset: ${assetName}`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existingAsset.id
              });
            }
          }

    - name: 上传构建产物到发布版本
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ env.UPLOAD_URL }}
        asset_path: ${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}
        asset_name: ${{ env.ARTIFACT_NAME }}
        asset_content_type: application/zip

    # - name: 上传代码包到发布版本
    #   uses: actions/upload-release-asset@v1
