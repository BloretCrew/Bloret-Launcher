name: 应用程序打包

permissions:
  contents: write

on:
  push:
    branches:
      - Windows

jobs:
  Set-Version:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v2

    - name: 更新版本号
      run: |
        python .github/workflows/refresh-version.py

    - name: 提交版本号更新到仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Bloret-Launcher-Setup.iss
        git add config.json
        git add cmcl.json
        git commit -m "更新 MyAppVersion 版本号和一些配置文件的默认值。"
        git push
      shell: pwsh
  Build-Windows:
    needs: Set-Version
    runs-on: windows-latest

    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Bloret-Launcher-Windows.zip'

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
      with:
        ref: 'Windows'

    - name: 验证资源文件路径
      run: |
        Get-ChildItem -Path .
        if (-not (Test-Path "bloret.ico")) { Write-Host "bloret.ico not found"; exit 1 }
        if (-not (Test-Path "config.json")) { Write-Host "config.json not found"; exit 1 }
        if (-not (Test-Path "ui")) { Write-Host "ui directory not found"; exit 1 }
        if (-not (Test-Path "cmcl.json")) { Write-Host "cmcl.json not found"; exit 1 }
        if (-not (Test-Path "cmcl.exe")) { Write-Host "cmcl.exe not found"; exit 1 }
        if (-not (Test-Path "cmcl.blank.json")) { Write-Host "cmcl.blank.json not found"; exit 1 }
        if (-not (Test-Path "frpc.toml")) { Write-Host "frpc.toml not found"; exit 1 }
        if (-not (Test-Path "frpc.exe")) { Write-Host "frpc.exe not found"; exit 1 }
      shell: pwsh

    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 安装程序依赖和打包依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pillow
        pip install pyinstaller
    
    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --noconsole --icon=bloret.ico --name=Bloret-Launcher `
          --add-data "bloret.ico;." `
          --add-data "config.json;." `
          --add-data "ui;ui" `
          --add-data "cmcl.json;." `
          --add-data "cmcl.exe;." `
          --add-data "cmcl.blank.json;." `
          --add-data "frpc.toml;." `
          --add-data "frpc.exe;." `
          --hidden-import=sip `
          --hidden-import=qfluentwidgets `
          --hidden-import=win11toast `
          --hidden-import=toml `
          --paths=. `
          Bloret-Launcher.py
      shell: pwsh

    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Bloret-Launcher.exe ${{ env.OUTPUT_DIR }}/
        cp -r ui/ ${{ env.OUTPUT_DIR }}/
        cp -r cmcl.exe ${{ env.OUTPUT_DIR }}/
        cp -r cmcl.json ${{ env.OUTPUT_DIR }}/
        cp -r cmcl.blank.json ${{ env.OUTPUT_DIR }}/
        cp -r config.json ${{ env.OUTPUT_DIR }}/
        cp -r LICENSE ${{ env.OUTPUT_DIR }}/
        cp -r servers.dat ${{ env.OUTPUT_DIR }}/
        cp -r cmcl_save.json ${{ env.OUTPUT_DIR }}/
        cp -r restart.ps1 ${{ env.OUTPUT_DIR }}/
        cp -r update.ps1 ${{ env.OUTPUT_DIR }}/
        cp -r bloret.ico ${{ env.OUTPUT_DIR }}/
        cp -r frpc.toml ${{ env.OUTPUT_DIR }}/
        cp -r frpc.exe ${{ env.OUTPUT_DIR }}/

    - name: 清理旧压缩包
      run: |
        if (Test-Path "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}") {
          Remove-Item "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
        }
      shell: pwsh

    - name: 创建压缩包
      run: Compress-Archive -Path "${{ env.OUTPUT_DIR }}/*" -DestinationPath "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
      shell: pwsh

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher
        path: "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
  Code-Package:
    needs: Set-Version
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
      with:
        ref: 'Windows'

    - name: 创建输出目录并清理
      run: |
        # 强制创建目录并清理旧内容
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: 复制所有文件（排除 .git 和 output）
      run: |
        # 递归复制所有文件到 output 目录，排除 .git 和 output 目录
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output")
        # 确保 LICENSE 文件被复制
        if (Test-Path "LICENSE") {
          Copy-Item -Path "LICENSE" -Destination "output\"
        } else {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 创建压缩包
      run: |
        # 直接压缩 output 目录内容为 Code-Package.zip
        Compress-Archive -Path "output/*" -DestinationPath "output/Code-Package.zip" -Force
      shell: pwsh

    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: Code-Package
        path: "output/Code-Package.zip"
  Build-Setup:
    needs: Build-Windows
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
      with:
        ref: 'Windows'

    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: Bloret-Launcher
        path: output

    - name: 解压构建产物
      run: |
        Expand-Archive -Path "output/Bloret-Launcher-Windows.zip" -DestinationPath "output/"
      shell: pwsh

    - name: 确保 LICENSE 文件存在
      run: |
        if (-not (Test-Path "output/LICENSE")) {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 展示完整文件夹目录
      run: |
        Write-Host "当前文件夹目录结构如下："
        Get-ChildItem -Path "output" -Recurse | Format-Table -AutoSize
      shell: pwsh

    - name: 设置系统语言为简体中文
      run: |
        Set-WinSystemLocale -SystemLocale zh-CN
        Write-Host "系统语言已设置为简体中文"
      shell: pwsh

    - name: 安装 Inno Setup
      run: |
        choco install innosetup --yes
      shell: pwsh

    - name: 运行 Inno Setup 构建安装程序
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Bloret-Launcher-Setup.iss"
      shell: pwsh

    - name: 上传安装程序
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-Setup
        path: "./output/Bloret Launcher Setup.exe"
  Build-macOS:
    needs: Set-Version
    runs-on: macos-latest
    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Bloret-Launcher-macOS.zip'
    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
      with:
        ref: 'Windows'
    - name: 验证资源文件路径
      run: |
        ls -alh .
        [ -f "bloret.ico" ] || (echo "bloret.ico not found" && exit 1)
        [ -f "config.json" ] || (echo "config.json not found" && exit 1)
        [ -d "ui" ] || (echo "ui directory not found" && exit 1)
        [ -f "cmcl.json" ] || (echo "cmcl.json not found" && exit 1)
        [ -f "cmcl.exe" ] || (echo "cmcl.exe not found" && exit 1)
        [ -f "cmcl.blank.json" ] || (echo "cmcl.blank.json not found" && exit 1)
        [ -f "frpc.toml" ] || (echo "frpc.toml not found" && exit 1)
        [ -f "frpc.exe" ] || (echo "frpc.exe not found" && exit 1)
      shell: bash
    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: 过滤掉 pywin32 和 win11toast 依赖
      run: |
        grep -ivE '^(pywin32|win11toast)' requirements.txt > requirements_nopywin32.txt
      shell: bash
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_nopywin32.txt
        pip install pillow pyinstaller
      shell: bash
    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --windowed --name=Bloret-Launcher \
          --add-data "bloret.ico:." \
          --add-data "config.json:." \
          --add-data "ui:ui" \
          --add-data "cmcl.json:." \
          --add-data "cmcl.exe:." \
          --add-data "cmcl.blank.json:." \
          --add-data "frpc.toml:." \
          --add-data "frpc.exe:." \
          --hidden-import=sip \
          --hidden-import=qfluentwidgets \
          --hidden-import=win11toast \
          --hidden-import=toml \
          --paths=. \
          Bloret-Launcher.py
      shell: bash
    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Bloret-Launcher ${{ env.OUTPUT_DIR }}/
        cp -r ui/ ${{ env.OUTPUT_DIR }}/
        cp cmcl.exe ${{ env.OUTPUT_DIR }}/
        cp cmcl.json ${{ env.OUTPUT_DIR }}/
        cp cmcl.blank.json ${{ env.OUTPUT_DIR }}/
        cp config.json ${{ env.OUTPUT_DIR }}/
        cp LICENSE ${{ env.OUTPUT_DIR }}/
        cp servers.dat ${{ env.OUTPUT_DIR }}/ || true
        cp cmcl_save.json ${{ env.OUTPUT_DIR }}/ || true
        cp restart.ps1 ${{ env.OUTPUT_DIR }}/ || true
        cp update.ps1 ${{ env.OUTPUT_DIR }}/ || true
        cp bloret.ico ${{ env.OUTPUT_DIR }}/
        cp frpc.toml ${{ env.OUTPUT_DIR }}/
        cp frpc.exe ${{ env.OUTPUT_DIR }}/
      shell: bash
    - name: 清理旧压缩包
      run: |
        [ -f "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" ] && rm "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" || true
      shell: bash
    - name: 创建压缩包
      run: zip -r "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" ${{ env.OUTPUT_DIR }}/*
      shell: bash
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-macOS
        path: "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}"
  Build-Linux:
    needs: Set-Version
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
      ARTIFACT_NAME: 'Bloret-Launcher-Linux.zip'
    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2
      with:
        ref: 'Windows'
    - name: 验证资源文件路径
      run: |
        ls -alh .
        [ -f "bloret.ico" ] || (echo "bloret.ico not found" && exit 1)
        [ -f "config.json" ] || (echo "config.json not found" && exit 1)
        [ -d "ui" ] || (echo "ui directory not found" && exit 1)
        [ -f "cmcl.json" ] || (echo "cmcl.json not found" && exit 1)
        [ -f "cmcl.exe" ] || (echo "cmcl.exe not found" && exit 1)
        [ -f "cmcl.blank.json" ] || (echo "cmcl.blank.json not found" && exit 1)
        [ -f "frpc.toml" ] || (echo "frpc.toml not found" && exit 1)
        [ -f "frpc.exe" ] || (echo "frpc.exe not found" && exit 1)
      shell: bash
    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: 过滤掉 pywin32 和 win11toast 依赖
      run: |
        grep -ivE '^(pywin32|win11toast)' requirements.txt > requirements_nopywin32.txt
      shell: bash
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_nopywin32.txt
        pip install pillow pyinstaller
      shell: bash
    - name: 使用 PyInstaller 打包
      run: |
        pyinstaller --onefile --windowed --name=Bloret-Launcher \
          --add-data "bloret.ico:." \
          --add-data "config.json:." \
          --add-data "ui:ui" \
          --add-data "cmcl.json:." \
          --add-data "cmcl.exe:." \
          --add-data "cmcl.blank.json:." \
          --add-data "frpc.toml:." \
          --add-data "frpc.exe:." \
          --hidden-import=sip \
          --hidden-import=qfluentwidgets \
          --hidden-import=win11toast \
          --hidden-import=toml \
          --paths=. \
          Bloret-Launcher.py
      shell: bash
    - name: 创建包含其他文件夹的目录
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        cp dist/Bloret-Launcher ${{ env.OUTPUT_DIR }}/
        cp -r ui/ ${{ env.OUTPUT_DIR }}/
        cp cmcl.exe ${{ env.OUTPUT_DIR }}/
        cp cmcl.json ${{ env.OUTPUT_DIR }}/
        cp cmcl.blank.json ${{ env.OUTPUT_DIR }}/
        cp config.json ${{ env.OUTPUT_DIR }}/
        cp LICENSE ${{ env.OUTPUT_DIR }}/
        cp servers.dat ${{ env.OUTPUT_DIR }}/ || true
        cp cmcl_save.json ${{ env.OUTPUT_DIR }}/ || true
        cp restart.ps1 ${{ env.OUTPUT_DIR }}/ || true
        cp update.ps1 ${{ env.OUTPUT_DIR }}/ || true
        cp bloret.ico ${{ env.OUTPUT_DIR }}/
        cp frpc.toml ${{ env.OUTPUT_DIR }}/
        cp frpc.exe ${{ env.OUTPUT_DIR }}/
      shell: bash
    - name: 清理旧压缩包
      run: |
        [ -f "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" ] && rm "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" || true
      shell: bash
    - name: 创建压缩包
      run: zip -r "${{ env.OUTPUT_DIR }}/${{ env.ARTIFACT_NAME }}" ${{ env.OUTPUT_DIR }}/*
      shell: bash