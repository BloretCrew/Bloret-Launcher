name: 应用程序打包 - Pyinstaller

permissions:
  contents: write

on:
  push:
    branches:
      - '**'        # 匹配所有分支
    tags-ignore:
      - '*'         # 忽略所有 tag 推送

jobs:
  Set-Version:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v2

    - name: 更新版本号
      run: |
        python .github/workflows/refresh-version.py

    - name: 提交版本号更新到仓库
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Bloret-Launcher-Setup.iss
        git add config.json
        git commit -m "更新 MyAppVersion 版本号和一些配置文件的默认值。"
        git push
      shell: pwsh
  Build-All:
    needs: Set-Version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Bloret-Launcher-Windows
          - os: ubuntu-latest
            artifact: Bloret-Launcher-Linux
          - os: macos-15-intel
            artifact: Bloret-Launcher-macOS-Intel
          - os: macos-latest
            artifact: Bloret-Launcher-macOS-ARM
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: '3.9'
      OUTPUT_DIR: 'output'
    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2

    - name: 设置 Python
      uses: actions/setup-python@v2
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        if [ "${{ runner.os }}" == "Windows" ]; then
          pip install -r requirements.txt
        else
          grep -ivE '^(pywin32|win11toast|winsdk)' requirements.txt > req_unix.txt
          pip install -r req_unix.txt
        fi
        pip install pillow pyinstaller
      shell: bash

    - name: 使用 PyInstaller 打包 (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --noconsole --icon=bloret.ico --name=Bloret-Launcher --noupx `
          --add-data "bloret.ico;." --add-data "config.json;." --add-data "ui;ui" --add-data "lang;lang" --add-data "easytier;easytier" --add-data "JavaWrapper.jar;." --add-data "modules;modules" `
          --hidden-import=sip --hidden-import=qfluentwidgets --hidden-import=win11toast --hidden-import=toml --hidden-import=winsdk --paths=. Bloret-Launcher.py
      shell: pwsh

    - name: 使用 PyInstaller 打包 (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --onefile --windowed --name=Bloret-Launcher \
          --add-data "bloret.ico:." --add-data "config.json:." --add-data "ui:ui" --add-data "lang:lang" --add-data "easytier:easytier" --add-data "modules:modules" --add-data "JavaWrapper.jar:." \
          --hidden-import=sip --hidden-import=qfluentwidgets --hidden-import=toml --paths=. Bloret-Launcher.py
      shell: bash

    - name: 使用 PyInstaller 打包 (macOS)
      if: runner.os == 'macOS'
      run: |
        # 尝试转换图标格式 (png -> icns) 使用 iconutil
        ICON_CMD=""
        if [ -f "Bloret-Fluent.png" ]; then
          mkdir -p build_assets/Bloret.iconset
          # 生成不同尺寸的图标
          for size in 16 32 128 256 512; do
            # 计算 80% 的尺寸用于内容，其余为留白
            content_size=$(python3 -c "print(int($size * 0.8))")
            sips -z $content_size $content_size Bloret-Fluent.png --out temp_content.png
            # 正常尺寸
            sips -p $size $size temp_content.png --out build_assets/Bloret.iconset/icon_${size}x${size}.png
            # @2x 尺寸
            double_size=$(($size * 2))
            double_content_size=$(python3 -c "print(int($double_size * 0.8))")
            sips -z $double_content_size $double_content_size Bloret-Fluent.png --out temp_content_2x.png
            sips -p $double_size $double_size temp_content_2x.png --out build_assets/Bloret.iconset/icon_${size}x${size}@2x.png
          done
          rm temp_content.png temp_content_2x.png
          
          # 打包为 icns
          if iconutil -c icns build_assets/Bloret.iconset -o build_assets/icon.icns; then
             ICON_CMD="--icon=build_assets/icon.icns"
          fi
        fi
        
        pyinstaller --onefile --windowed --name=Bloret-Launcher $ICON_CMD \
          --add-data "bloret.ico:." --add-data "config.json:." --add-data "ui:ui" --add-data "lang:lang" --add-data "easytier:easytier" --add-data "modules:modules" --add-data "JavaWrapper.jar:." \
          --hidden-import=sip --hidden-import=qfluentwidgets --hidden-import=toml --paths=. Bloret-Launcher.py
      shell: bash

    - name: 收集产物
      run: |
        mkdir -p ${{ env.OUTPUT_DIR }}
        if [ "${{ runner.os }}" == "Windows" ]; then
          cp dist/Bloret-Launcher.exe ${{ env.OUTPUT_DIR }}/
        elif [ "${{ runner.os }}" == "macOS" ]; then
          cp -r dist/Bloret-Launcher.app ${{ env.OUTPUT_DIR }}/
        else
          cp dist/Bloret-Launcher ${{ env.OUTPUT_DIR }}/
        fi
        cp -r ui lang easytier config.json LICENSE bloret.ico JavaWrapper.jar ${{ env.OUTPUT_DIR }}/
        cp servers.dat ${{ env.OUTPUT_DIR }}/ || true
      shell: bash

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: "${{ env.OUTPUT_DIR }}/"

  Code-Package:
    needs: Set-Version
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2

    - name: 创建输出目录并清理
      run: |
        # 强制创建目录并清理旧内容
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: 复制所有文件（排除 .git 和 output）
      run: |
        # 递归复制所有文件到 output 目录，排除 .git 和 output 目录
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output")
        # 确保 LICENSE 文件被复制
        if (Test-Path "LICENSE") {
          Copy-Item -Path "LICENSE" -Destination "output\"
        } else {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 创建压缩包
      run: |
        # 直接压缩 output 目录内容为 Code-Package.zip
        Compress-Archive -Path "output/*" -DestinationPath "output/Code-Package.zip" -Force
      shell: pwsh

    - name: 上传压缩包
      uses: actions/upload-artifact@v4
      with:
        name: Code-Package
        path: "output/Code-Package.zip"
  Build-Setup:
    needs: Build-All
    runs-on: windows-latest

    steps:
    - name: 检出最新版本
      uses: actions/checkout@v2

    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        name: Bloret-Launcher-Windows
        path: output

    # - name: 解压构建产物
    #   run: |
    #     Expand-Archive -Path "output/Bloret-Launcher-Windows.zip" -DestinationPath "output/"
    #   shell: pwsh

    - name: 确保 LICENSE 文件存在
      run: |
        if (-not (Test-Path "output/LICENSE")) {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: 展示完整文件夹目录
      run: |
        Write-Host "当前文件夹目录结构如下："
        Get-ChildItem -Path "output" -Recurse | Format-Table -AutoSize
      shell: pwsh

    - name: 设置系统语言为简体中文
      run: |
        Set-WinSystemLocale -SystemLocale zh-CN
        Write-Host "系统语言已设置为简体中文"
      shell: pwsh

    - name: 安装 Inno Setup
      run: |
        choco install innosetup --yes
      shell: pwsh

    - name: 运行 Inno Setup 构建安装程序
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Bloret-Launcher-Setup.iss"
      shell: pwsh

    - name: 上传安装程序
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-Setup
        path: "./output/Bloret-Launcher-Setup.exe"

