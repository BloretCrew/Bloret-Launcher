name: Build - PyInstaller

permissions:
  contents: write

on:
  push:
    branches:
      - '**'        # Match all branches
    tags-ignore:
      - '*'         # Ignore all tag pushes

jobs:
  Set-Version:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        # 版本号脚本只改根目录文件，不需要子模块；
        # 子模块指针若指向未推送 commit，会在这里直接失败并拖垮整条打包流水线。
        submodules: false
        # Push back to the current branch; keep full history to reduce non-fast-forward issues
        fetch-depth: 0

    - name: Update version number
      run: |
        python .github/workflows/refresh-version.py

    - name: Commit version update to repository
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add Bloret-Launcher-Setup.iss
        git add config.json
        if (git status --porcelain -- Bloret-Launcher-Setup.iss config.json) {
          git commit -m "Update MyAppVersion version and default values in configuration files."
          git push
        } else {
          Write-Host "版本相关文件无变更，跳过提交"
        }
      shell: pwsh
  Build-All:
    needs: Set-Version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Bloret-Launcher-Windows
          - os: ubuntu-latest
            artifact: Bloret-Launcher-Linux
          - os: macos-15-intel
            artifact: Bloret-Launcher-macOS-Intel
          - os: macos-latest
            artifact: Bloret-Launcher-macOS-ARM
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: '3.10'
      OUTPUT_DIR: 'output'
    steps:
    - name: Check out latest version
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Check and repair submodule pointers
      run: |
        set -e
        git submodule foreach --recursive '
          remote_url=$(git remote get-url origin 2>/dev/null) || true
          test -n "$remote_url" || exit 0
          case "$remote_url" in *github.com:*@github.com:*) exit 0 ;; esac
          commit=$(git rev-parse HEAD)
          # Use fetch to check whether the commit exists remotely (ls-remote matches by ref name and is unreliable)
          if ! git fetch origin "$commit" --depth=1 2>/dev/null; then
            echo "::warning::$name: commit $commit 不在远端，自动修复（仅本 job 生效）..."
            default_branch=$(git ls-remote --symref origin HEAD 2>/dev/null \
              | awk "/^ref: /{print \$2}" | sed "s|refs/heads/||")
            test -z "$default_branch" && default_branch="main"
            git fetch origin "$default_branch" --depth=1
            new_commit=$(git rev-parse "origin/$default_branch")
            git reset --hard "$new_commit"
            echo "✅ $name: $commit → $new_commit"
          else
            echo "✓ $name @ $commit"
          fi
        '
        echo "✔ Check complete (fixes are local to this job and are not pushed back)"
      shell: bash

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ "${{ runner.os }}" == "Windows" ]; then
          pip install -r requirements.txt
        else
          # Environment markers should skip Windows packages; filter one more line to avoid differences in older pip behavior
          grep -ivE '^(pywin32|win11toast|winsdk)([; =]|$)' requirements.txt > req_unix.txt
          pip install -r req_unix.txt
        fi
        pip install pillow pyinstaller
        # AppImage requires FUSE; keep this aligned with Nuitka-Build
        if [ "${{ runner.os }}" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2
        fi
      shell: bash

    - name: Download platform-specific EasyTier
      run: |
        EASYTIER_VERSION="v2.6.4"
        ARCH=$(uname -m)
        case "${{ runner.os }}" in
          Windows)
            EASYTIER_ZIP="easytier-windows-x86_64-${EASYTIER_VERSION}.zip"
            ;;
          Linux)
            if [ "$ARCH" = "x86_64" ]; then
              EASYTIER_ZIP="easytier-linux-x86_64-${EASYTIER_VERSION}.zip"
            elif [ "$ARCH" = "aarch64" ]; then
              EASYTIER_ZIP="easytier-linux-aarch64-${EASYTIER_VERSION}.zip"
            fi
            ;;
          macOS)
            if [ "$ARCH" = "x86_64" ]; then
              EASYTIER_ZIP="easytier-macos-x86_64-${EASYTIER_VERSION}.zip"
            elif [ "$ARCH" = "arm64" ]; then
              EASYTIER_ZIP="easytier-macos-aarch64-${EASYTIER_VERSION}.zip"
            fi
            ;;
        esac

        if [ -n "$EASYTIER_ZIP" ]; then
          rm -rf easytier
          mkdir -p easytier
          # Prefer the gh CLI (built-in retries); fall back to curl on failure
          if command -v gh &>/dev/null; then
            gh release download "$EASYTIER_VERSION" -R "EasyTier/EasyTier" -p "$EASYTIER_ZIP" || \
              curl -L --retry 3 --retry-delay 5 -o "$EASYTIER_ZIP" "https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_VERSION}/${EASYTIER_ZIP}"
          else
            curl -L --retry 3 --retry-delay 5 -o "$EASYTIER_ZIP" "https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_VERSION}/${EASYTIER_ZIP}"
          fi
          # Select the public digest pinned to this release and platform.
          EASYTIER_SHA256=$(awk -v asset="$EASYTIER_ZIP" '$2 == asset {print $1}' ".github/checksums/easytier-${EASYTIER_VERSION}.sha256")
          if [ -z "${EASYTIER_SHA256:-}" ]; then echo "::error::Missing EasyTier SHA-256"; exit 1; fi
          if ! echo "$EASYTIER_SHA256  $EASYTIER_ZIP" | sha256sum -c -; then exit 1; fi
          if ! unzip -t "$EASYTIER_ZIP" &>/dev/null; then
            echo "::error::EasyTier download failed: invalid zip file"
            exit 1
          fi
          unzip -o "$EASYTIER_ZIP" -d easytier-tmp
          find easytier-tmp -name "easytier-core*" -exec cp {} easytier/ \;
          find easytier-tmp -name "easytier-cli*" -exec cp {} easytier/ \;
          chmod +x easytier/easytier-core* easytier/easytier-cli* 2>/dev/null || true
          rm -rf easytier-tmp "$EASYTIER_ZIP"
          echo "EasyTier for ${{ runner.os }} ($ARCH) ready"
        else
          echo "No EasyTier binary available for ${{ runner.os }} ($ARCH), skipping"
        fi
      shell: bash

    # 非 onefile：目录分发，启动时不再整包解压到临时目录
    - name: Package with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onedir --noconsole --icon=bloret.ico --name=Bloret-Launcher --noupx `
          --add-data "bloret.ico;." --add-data "Bloret.png;." --add-data "Bloret-Fluent.png;." --add-data "config.json;." --add-data "ui;ui" --add-data "RinUI;RinUI" --add-data "qml;qml" --add-data "icon;icon" --add-data "lang;lang" --add-data "easytier;easytier" --add-data "JavaWrapper.jar;." --add-data "modules;modules" --add-data "LICENSE;." `
          --hidden-import=toml --hidden-import=darkdetect --hidden-import=send2trash --hidden-import=psutil --hidden-import=dulwich --hidden-import=qrcode --hidden-import=win11toast --hidden-import=winsdk --paths=. Bloret-Launcher.py
      shell: pwsh

    - name: Code sign (Windows main executable)
      if: runner.os == 'Windows'
      env:
        WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"
        $exe = "dist\Bloret-Launcher\Bloret-Launcher.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::Missing $exe for signing"
          Get-ChildItem -Path dist -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 20 FullName
          exit 1
        }
        & pwsh -NoProfile -ExecutionPolicy Bypass -File ".github/scripts/windows-codesign.ps1" `
          -Path $exe `
          -Description "Bloret Launcher" `

      shell: pwsh

    - name: Package with PyInstaller (Linux)
      if: runner.os == 'Linux'
      run: |
        # sip / qfluentwidgets have been removed (the UI now uses PySide6 + modules.compat_widgets)
        EXTRA_DATA=""
        if [ -f servers.dat ]; then EXTRA_DATA="$EXTRA_DATA --add-data servers.dat:."; fi
        if [ -f LICENSE ]; then EXTRA_DATA="$EXTRA_DATA --add-data LICENSE:."; fi
        pyinstaller --onedir --windowed --name=Bloret-Launcher \
          --add-data "bloret.ico:." --add-data "Bloret.png:." --add-data "Bloret-Fluent.png:." --add-data "config.json:." --add-data "ui:ui" --add-data "RinUI:RinUI" --add-data "qml:qml" --add-data "icon:icon" --add-data "lang:lang" --add-data "easytier:easytier" --add-data "modules:modules" --add-data "JavaWrapper.jar:." \
          $EXTRA_DATA \
          --hidden-import=toml --hidden-import=darkdetect --hidden-import=send2trash --hidden-import=psutil --hidden-import=dulwich --hidden-import=qrcode --paths=. Bloret-Launcher.py
      shell: bash

    - name: Package with PyInstaller (macOS)
      if: runner.os == 'macOS'
      run: |
        # Try converting the icon format (png -> icns) with iconutil
        ICON_CMD=""
        if [ -f "Bloret-Fluent.png" ]; then
          mkdir -p build_assets/Bloret.iconset
          # 生成不同尺寸的图标
          for size in 16 32 128 256 512; do
            # Use 80% of the size for content and leave the rest as padding
            content_size=$(python3 -c "print(int($size * 0.8))")
            sips -z $content_size $content_size Bloret-Fluent.png --out temp_content.png
            # 正常尺寸
            sips -p $size $size temp_content.png --out build_assets/Bloret.iconset/icon_${size}x${size}.png
            # @2x 尺寸
            double_size=$(($size * 2))
            double_content_size=$(python3 -c "print(int($double_size * 0.8))")
            sips -z $double_content_size $double_content_size Bloret-Fluent.png --out temp_content_2x.png
            sips -p $double_size $double_size temp_content_2x.png --out build_assets/Bloret.iconset/icon_${size}x${size}@2x.png
          done
          rm temp_content.png temp_content_2x.png
          
          # 打包为 icns
          if iconutil -c icns build_assets/Bloret.iconset -o build_assets/icon.icns; then
             ICON_CMD="--icon=build_assets/icon.icns"
          fi
        fi
        
        # onedir + windowed: build an .app bundle (no onefile extraction at startup)
        pyinstaller --onedir --windowed --name="Bloret Launcher" $ICON_CMD \
          --add-data "bloret.ico:." --add-data "Bloret.png:." --add-data "Bloret-Fluent.png:." --add-data "config.json:." --add-data "ui:ui" --add-data "RinUI:RinUI" --add-data "qml:qml" --add-data "icon:icon" --add-data "lang:lang" --add-data "easytier:easytier" --add-data "modules:modules" --add-data "JavaWrapper.jar:." --add-data "LICENSE:." \
          --hidden-import=toml --hidden-import=darkdetect --hidden-import=send2trash --hidden-import=psutil --hidden-import=dulwich --hidden-import=qrcode --paths=. Bloret-Launcher.py

        # 生成 DMG 文件
        brew install create-dmg
        
        # 获取架构名称
        ARCH=$(uname -m)
        if [ "$ARCH" == "x86_64" ]; then
          DMG_NAME="Bloret-Launcher-macOS-Intel.dmg"
        else
          DMG_NAME="Bloret-Launcher-macOS-arm.dmg"
        fi

        # 创建简单的背景图
        python3 -c "from PIL import Image, ImageDraw; img = Image.new('RGB', (600, 400), (240, 240, 240)); draw = ImageDraw.Draw(img); draw.polygon([(250, 200), (350, 200), (350, 150), (450, 250), (350, 350), (350, 300), (250, 300)], fill=(100, 100, 100)); img.save('dmg_bg.png')" || true

        rm -f "$DMG_NAME"
        create-dmg \
          --volname "Bloret Launcher" \
          --volicon "build_assets/icon.icns" \
          --background "dmg_bg.png" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "Bloret Launcher.app" 150 250 \
          --hide-extension "Bloret Launcher.app" \
          --app-drop-link 450 250 \
          "$DMG_NAME" \
          "dist/Bloret Launcher.app/"
      shell: bash

    - name: Collect artifacts
      run: |
        # Windows runners usually lack the zip command, so use Python for cross-platform archiving
        make_zip() {
          local src_dir="$1"
          local zip_path="$2"
          python - "$src_dir" "$zip_path" <<'PY'
        import sys, zipfile
        from pathlib import Path
        src = Path(sys.argv[1]).resolve()
        zip_path = Path(sys.argv[2]).resolve()
        zip_path.parent.mkdir(parents=True, exist_ok=True)
        with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
            for path in src.rglob("*"):
                if path.is_file():
                    zf.write(path, arcname=str(Path(src.name) / path.relative_to(src)))
        print(f"wrote {zip_path} ({zip_path.stat().st_size} bytes)")
        PY
        }

        mkdir -p ${{ env.OUTPUT_DIR }}
        if [ "${{ runner.os }}" == "Windows" ]; then
          # onedir：整目录发布（zip + 展开目录，供 Inno Setup 安装）
          test -d dist/Bloret-Launcher
          test -f dist/Bloret-Launcher/Bloret-Launcher.exe
          cp -r dist/Bloret-Launcher "${{ env.OUTPUT_DIR }}/Bloret-Launcher"
          for f in LICENSE bloret.ico config.json JavaWrapper.jar Bloret.png Bloret-Fluent.png servers.dat; do
            if [ -f "$f" ] && [ ! -f "${{ env.OUTPUT_DIR }}/Bloret-Launcher/$f" ]; then
              cp "$f" "${{ env.OUTPUT_DIR }}/Bloret-Launcher/$f"
            fi
          done
          make_zip "${{ env.OUTPUT_DIR }}/Bloret-Launcher" "${{ env.OUTPUT_DIR }}/Bloret-Launcher-Windows-onedir.zip"
        elif [ "${{ runner.os }}" == "macOS" ]; then
          cp *.dmg ${{ env.OUTPUT_DIR }}/
        elif [ "${{ runner.os }}" == "Linux" ]; then
          ARCH=$(uname -m)
          test -d dist/Bloret-Launcher
          test -x dist/Bloret-Launcher/Bloret-Launcher || test -f dist/Bloret-Launcher/Bloret-Launcher
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/lib/bloret-launcher
          # Place the entire onedir runtime in lib; the entry script invokes its executable
          cp -a dist/Bloret-Launcher/. AppDir/usr/lib/bloret-launcher/
          cat > AppDir/usr/bin/bloret-launcher << 'EOF'
        #!/bin/sh
        DIR="$(dirname "$(readlink -f "$0" 2>/dev/null || echo "$0")")"
        ROOT="$(cd "$DIR/.." && pwd)"
        exec "$ROOT/lib/bloret-launcher/Bloret-Launcher" "$@"
        EOF
          chmod +x AppDir/usr/bin/bloret-launcher AppDir/usr/lib/bloret-launcher/Bloret-Launcher
          # appimagetool needs an explicit entrypoint; without it the generated
          # AppImage starts with "execv error: No such file or directory".
          cat > AppDir/AppRun << 'EOF'
        #!/bin/sh
        APPDIR="${APPDIR:-$(dirname "$(readlink -f "$0" 2>/dev/null || echo "$0")")}"
        exec "$APPDIR/usr/bin/bloret-launcher" "$@"
        EOF
          chmod +x AppDir/AppRun
          test -x AppDir/AppRun
          # Still include source-tree resources as a fallback (onedir already contains packaged data)
          cp -r RinUI qml ui icon lang config.json LICENSE bloret.ico Bloret.png Bloret-Fluent.png JavaWrapper.jar AppDir/usr/share/ 2>/dev/null || true
          mkdir -p AppDir/usr/share/bloret-launcher
          cp -r RinUI qml ui icon lang config.json LICENSE bloret.ico Bloret.png Bloret-Fluent.png JavaWrapper.jar AppDir/usr/share/bloret-launcher/ 2>/dev/null || true
          if [ -d "easytier" ]; then cp -r easytier AppDir/usr/share/bloret-launcher/; fi
          cp servers.dat AppDir/usr/share/bloret-launcher/ || true
          cat > AppDir/bloret-launcher.desktop << EOF
        [Desktop Entry]
        Type=Application
        Name=Bloret Launcher
        GenericName=Minecraft
        Comment=A Minecraft Launcher designed by BloretValley administrator.
        Exec=bloret-launcher
        Icon=bloret-launcher
        Terminal=false
        Categories=Game;
        EOF
          cp AppDir/bloret-launcher.desktop AppDir/usr/share/applications/bloret-launcher.desktop
          if [ -f "Bloret-Fluent.png" ]; then
            cp Bloret-Fluent.png AppDir/bloret-launcher.png
          elif [ -f "img/BL.png" ]; then
            cp img/BL.png AppDir/bloret-launcher.png
          else
            python -c "from PIL import Image; Image.open('bloret.ico').save('AppDir/bloret-launcher.png')"
          fi
          cp AppDir/bloret-launcher.png AppDir/.DirIcon
          APPIMAGETOOL_VERSION="continuous"
          APPIMAGETOOL_SHA256=$(awk -v asset="appimagetool-${ARCH}.AppImage" '$2 == asset {print $1}' ".github/checksums/appimagetool-${APPIMAGETOOL_VERSION}.sha256")
          if [ -z "$APPIMAGETOOL_SHA256" ]; then echo "::error::Missing appimagetool SHA-256"; exit 1; fi
          curl --fail --location --retry 3 -o appimagetool "https://github.com/AppImage/AppImageKit/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool | sha256sum -c -
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir "${{ env.OUTPUT_DIR }}/Bloret-Launcher-Linux.AppImage"
          # 兜底资源进 onedir，再打 zip
          for f in LICENSE bloret.ico config.json JavaWrapper.jar Bloret.png Bloret-Fluent.png servers.dat; do
            if [ -f "$f" ] && [ ! -f "dist/Bloret-Launcher/$f" ]; then
              cp "$f" "dist/Bloret-Launcher/$f"
            fi
          done
          make_zip "dist/Bloret-Launcher" "${{ env.OUTPUT_DIR }}/Bloret-Launcher-Linux-onedir.zip"
        fi
      shell: bash

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: "${{ env.OUTPUT_DIR }}/"

  # FreeBSD: source-layout zip + EasyTier binary + import smoke (via FreeBSD VM).
  # Full PyInstaller/Nuitka on FreeBSD is optional; users run with system PySide6.
  Build-FreeBSD:
    needs: Set-Version
    runs-on: ubuntu-latest
    env:
      EASYTIER_VERSION: v2.6.4
      OUTPUT_DIR: output
    steps:
    - name: Check out latest version
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Download EasyTier FreeBSD binaries
      run: |
        EASYTIER_ZIP="easytier-freebsd-13.2-x86_64-${EASYTIER_VERSION}.zip"
        rm -rf easytier
        mkdir -p easytier
        curl --fail --location --retry 3 --retry-delay 5 -o "$EASYTIER_ZIP" \
          "https://github.com/EasyTier/EasyTier/releases/download/${EASYTIER_VERSION}/${EASYTIER_ZIP}"
        EASYTIER_SHA256=$(awk -v asset="$EASYTIER_ZIP" '$2 == asset {print $1}' ".github/checksums/easytier-${EASYTIER_VERSION}.sha256")
        if [ -z "${EASYTIER_SHA256:-}" ]; then echo "::error::Missing EasyTier SHA-256"; exit 1; fi
        if ! printf '%s  %s\n' "$EASYTIER_SHA256" "$EASYTIER_ZIP" | sha256sum -c -; then exit 1; fi
        if ! unzip -t "$EASYTIER_ZIP" &>/dev/null; then
          echo "::error::EasyTier FreeBSD download failed: invalid zip"
          exit 1
        fi
        unzip -o "$EASYTIER_ZIP" -d easytier-tmp
        find easytier-tmp -name "easytier-core*" -exec cp {} easytier/ \;
        find easytier-tmp -name "easytier-cli*" -exec cp {} easytier/ \;
        chmod +x easytier/easytier-core* easytier/easytier-cli* 2>/dev/null || true
        rm -rf easytier-tmp "$EASYTIER_ZIP"
        ls -la easytier/
      shell: bash

    - name: FreeBSD smoke test + package zip
      uses: vmactions/freebsd-vm@v1
      with:
        release: "14.3"
        usesh: true
        prepare: |
          # This job tests platform logic and creates a source-layout archive;
          # it intentionally does not import or install the GUI stack.
          pkg install -y python3 git curl unzip zip
          python3 --version
        run: |
          set -e
          python3 - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from modules.platform_compat import (
              is_freebsd, mojang_os_name, mojang_native_classifier,
              uses_system_lwjgl, datapath_default, update_artifact_kind,
              easytier_release_zip_name,
          )
          assert is_freebsd(), "expected FreeBSD host"
          assert mojang_os_name() == "linux", mojang_os_name()
          assert uses_system_lwjgl() is True
          assert update_artifact_kind() == "freebsd_zip"
          assert mojang_native_classifier(
              {"natives": {"linux": "natives-linux"}}
          ) is None
          print("platform_compat OK", datapath_default(), easytier_release_zip_name())
          print("native classifier OK")
          PY
          mkdir -p output
          STAGE=Bloret-Launcher-FreeBSD-amd64
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for item in Bloret-Launcher.py modules qml RinUI icon lang easytier \
            config.json requirements.txt LICENSE bloret.ico Bloret.png \
            Bloret-Fluent.png JavaWrapper.jar docs; do
            if [ -e "$item" ]; then
              cp -a "$item" "$STAGE/"
            fi
          done
          # Lightweight runner script (no leading whitespace)
          printf '%s\n' \
            '#!/bin/sh' \
            'DIR=$(CDPATH= cd -- "$(dirname "$0")" && pwd)' \
            'exec python3 "$DIR/Bloret-Launcher.py" "$@"' \
            > "$STAGE/bloret-launcher"
          chmod +x "$STAGE/bloret-launcher"
          tar -czf "output/Bloret-Launcher-FreeBSD-amd64.tar.gz" "$STAGE"
          if command -v zip >/dev/null 2>&1; then
            zip -r "output/Bloret-Launcher-FreeBSD-amd64.zip" "$STAGE"
          else
            python3 - <<'PY'
          import shutil
          shutil.make_archive(
              "output/Bloret-Launcher-FreeBSD-amd64", "zip",
              root_dir=".", base_dir="Bloret-Launcher-FreeBSD-amd64",
          )
          PY
          fi
          ls -la output/

    - name: Upload FreeBSD artifact
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-FreeBSD-amd64
        path: "output/"

  Code-Package:
    needs: Set-Version
    runs-on: windows-latest

    steps:
    - name: Check out latest version
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Create output directory and clean
      run: |
        # 强制创建目录并清理旧内容
        New-Item -ItemType Directory -Force -Path "output"
        Remove-Item -Path "output/*" -Recurse -ErrorAction Ignore
      shell: pwsh

    - name: Copy all files (excluding .git and output)
      run: |
        # Recursively copy all files to output, excluding .git and output
        Copy-Item -Path "*" -Destination "output" -Recurse -Exclude @(".git", "output")
        # 确保 LICENSE 文件被复制
        if (Test-Path "LICENSE") {
          Copy-Item -Path "LICENSE" -Destination "output\"
        } else {
          Write-Host "LICENSE 文件未找到"
          exit 1
        }
      shell: pwsh

    - name: Create archive
      run: |
        # 直接压缩 output 目录内容为 Code-Package.zip
        Compress-Archive -Path "output/*" -DestinationPath "output/Code-Package.zip" -Force
      shell: pwsh

    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: Code-Package
        path: "output/Code-Package.zip"
  Build-Setup:
    needs: Build-All
    runs-on: windows-latest

    steps:
    - name: Check out latest version
      uses: actions/checkout@v4
      with:
        submodules: true
        # Use Setup.iss from the triggering branch (onedir); do not hard-code the old Windows script
        ref: ${{ github.ref }}

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: Bloret-Launcher-Windows
        path: output

    - name: Prepare onedir installer resources
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "=== output tree (depth 2) ==="
        Get-ChildItem -Path "output" -Recurse -Depth 2 | Format-Table -AutoSize

        $appDir = "output\Bloret-Launcher"
        if (-not (Test-Path "$appDir\Bloret-Launcher.exe")) {
          if (Test-Path "output\Bloret-Launcher.exe") {
            New-Item -ItemType Directory -Force -Path $appDir | Out-Null
            Get-ChildItem "output" -Force | Where-Object { $_.Name -ne "Bloret-Launcher" } | ForEach-Object {
              Move-Item $_.FullName -Destination $appDir -Force
            }
          } else {
            Write-Host "onedir 目录缺少 Bloret-Launcher.exe"
            Get-ChildItem -Path "output" -Recurse -Depth 3 | Format-Table -AutoSize
            exit 1
          }
        }

        foreach ($name in @("LICENSE", "bloret.ico", "config.json", "JavaWrapper.jar", "servers.dat")) {
          $dest = Join-Path $appDir $name
          if (-not (Test-Path $dest)) {
            if (Test-Path $name) {
              Copy-Item $name $dest -Force
              Write-Host "Copied $name -> $dest"
            } elseif (Test-Path "output\$name") {
              Copy-Item "output\$name" $dest -Force
              Write-Host "Copied output\$name -> $dest"
            }
          }
        }

        if (-not (Test-Path "$appDir\Bloret-Launcher.exe")) {
          Write-Host "仍缺少 $appDir\Bloret-Launcher.exe"
          exit 1
        }
        if (-not (Test-Path "$appDir\bloret.ico") -and (Test-Path "bloret.ico")) {
          Copy-Item "bloret.ico" "$appDir\bloret.ico" -Force
        }
        if (-not (Test-Path "output\LICENSE") -and (Test-Path "$appDir\LICENSE")) {
          Copy-Item "$appDir\LICENSE" "output\LICENSE" -Force
        }
        if (-not (Test-Path "output\LICENSE") -and (Test-Path "LICENSE")) {
          Copy-Item "LICENSE" "output\LICENSE" -Force
        }
      shell: pwsh

    - name: Show full folder contents
      run: |
        Write-Host "当前文件夹目录结构如下："
        Get-ChildItem -Path "output" -Recurse -Depth 2 | Format-Table -AutoSize
      shell: pwsh

    - name: Set system language to Simplified Chinese
      run: |
        Set-WinSystemLocale -SystemLocale zh-CN
        Write-Host "System language set to Simplified Chinese"
      shell: pwsh

    - name: Install Inno Setup
      run: |
        choco install innosetup --yes
      shell: pwsh

    - name: Code sign (executables in install directory)
      env:
        WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"
        $exe = "output\Bloret-Launcher\Bloret-Launcher.exe"
        if (-not (Test-Path $exe)) {
          Write-Host "::error::Missing $exe before setup build"
          exit 1
        }
        & pwsh -NoProfile -ExecutionPolicy Bypass -File ".github/scripts/windows-codesign.ps1" `
          -Path $exe `
          -Description "Bloret Launcher" `

      shell: pwsh

    - name: Run Inno Setup to build installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ".\Bloret-Launcher-Setup.iss"
      shell: pwsh

    - name: Code sign (installer)
      env:
        WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      run: |
        $ErrorActionPreference = "Stop"
        $setup = "output\Bloret-Launcher-Setup.exe"
        if (-not (Test-Path $setup)) {
          Write-Host "::error::Missing $setup after Inno Setup"
          exit 1
        }
        & pwsh -NoProfile -ExecutionPolicy Bypass -File ".github/scripts/windows-codesign.ps1" `
          -Path $setup `
          -Description "Bloret Launcher Setup" `

      shell: pwsh

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Bloret-Launcher-Setup
        path: "./output/Bloret-Launcher-Setup.exe"

