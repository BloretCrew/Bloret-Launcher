name: Bug Report
description: Report a bug encountered while using Bloret Launcher.
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please use a title that clearly describes the problem so developers can resolve it.

        ### Checklist

        Before reporting this issue, please confirm the following:

        1. I have updated to the latest version ![GitHub Release](https://img.shields.io/github/v/release/BloretCrew/Bloret-Launcher?include_prereleases) and reviewed the [latest commits](https://github.com/BloretCrew/Bloret-Launcher/commits).
        2. I have searched [Issues](https://github.com/BloretCrew/Bloret-Launcher/issues?q=label%3ABug) and confirmed this bug has not been reported.
        3. I understand and agree that this tracker is only for problems in the program itself (topics not related to the program should be raised in Discussions).

  - type: markdown
    attributes:
      value: |
        ## Bug Information

        Describe the bug. You may attach screenshots, screen recordings, stack traces, logs, and other materials to help developers track down the problem.

        > [!WARNING]
        > If you upload materials, wait for the upload to finish before publishing the issue.
        >
        > If you see `![Uploading filename]()`, the upload is still in progress. Wait for the link to update before submitting.

  - type: dropdown
    id: where-happened
    attributes:
      label: Where did the problem occur?
      options:
        - Startup
        - Home
        - Loading screen
        - Download
        - Download -> Core
        - Download -> Select version folder
        - Download -> Select version
        - Download -> Select mirror
        - Download -> Notification after download
        - Download -> Download and install
        - Tools
        - Tools -> Player UUID lookup
        - Tools -> Player name lookup
        - Tools -> Player skin lookup
        - Tools -> Player cape lookup
        - PassPort
        - PassPort -> Account name setup
        - Settings
        - Settings -> Check for updates
        - Settings -> Theme switch
        - Settings -> Loading icon switch
        - Settings -> Log storage
        - Settings -> Clear logs
        - About
        - Other
      description: Select where the problem occurred so we can locate it more easily.
    validations:
      required: true

  - type: textarea
    id: excepted
    attributes:
      label: Describe the bug
      description: Describe in detail the behavior you expected and how it differs from the current (possibly incorrect) behavior. For the actual behavior, include screenshots, recordings, or text descriptions where possible. Describe the steps needed to reproduce the bug, including attachments such as screenshots or recordings.
    validations:
      required: false

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace
      description: Copy the contents of the log file for the session in which the problem occurred from the log folder. (The log folder is located at `%appdata%\Bloret-Launcher\log`, i.e. `C:\Users\{username}\AppData\Roaming\Bloret-Launcher\log`.)
      render: shell

  - type: input
    id: app_version
    attributes:
      label: App version
      description: The version of Bloret Launcher you are using. You can find it in Settings. Leave blank if you are using the latest build.
      placeholder: "e.g. 6.2"
    validations:
      required: false

  - type: input
    id: os_version
    attributes:
      label: Operating system version
      description: |
        If you are using Windows, run `winver.exe` to check. For other systems, search online for instructions.
      placeholder: "e.g. Windows 11"
