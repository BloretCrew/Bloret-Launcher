name: Feature Request
description: Suggest a new feature.
labels: ["New"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing your idea. Please use a title that clearly summarizes the feature so developers can understand it.

        > [!IMPORTANT]
        > Important: If you want to suggest **multiple features**, open a **separate** issue for each one.

        ### Checklist

        Before making a suggestion, please confirm all of the following:

        1. I have updated to the latest version ![GitHub Release](https://img.shields.io/github/v/release/BloretCrew/Bloret-Launcher?include_prereleases) and reviewed the [latest commits](https://github.com/BloretCrew/Bloret-Launcher/commits/main/), and confirmed the feature I want has not been implemented.
        2. I have searched [Issues](https://github.com/BloretCrew/Bloret-Launcher/issues?q=label:New) and confirmed a similar suggestion has **not** been submitted.
        3. I believe the feature is widely needed by users, cannot be replaced by a plugin, and does not exceed the software's original development goals, and is not beyond content related to Minecraft, Bloret, and other services and projects.
        4. I understand that due to limited developer time, my feature request may take a long time to implement.

  - type: markdown
    attributes:
      value: |
        ### New Feature

        Describe your new feature. You may attach screenshots, screen recordings, stack traces, logs, and other materials to help developers.

        > [!WARNING]
        > If you upload materials, wait for the upload to finish before publishing the issue.
        >
        > If you see `![Uploading filename]()`, the upload is still in progress. Wait for the link to update before submitting.

  - type: dropdown
    id: where-want
    attributes:
      label: Where should this be improved?
      options:
        - Startup
        - Home
        - Loading screen
        - Download
        - Download -> Core
        - Download -> Select version folder
        - Download -> Select version
        - Download -> Select mirror
        - Download -> Notification after download
        - Download -> Download and install
        - Tools
        - Tools -> Player UUID lookup
        - Tools -> Player name lookup
        - Tools -> Player skin lookup
        - Tools -> Player cape lookup
        - PassPort
        - PassPort -> Account name setup
        - Settings
        - Settings -> Check for updates
        - Settings -> Theme switch
        - Settings -> Loading icon switch
        - Settings -> Log storage
        - Settings -> Clear logs
        - About
        - Bloriko - AI
        - Other
      description: Select the area to improve so we can better understand the feature.
    validations:
      required: true

  - type: textarea
    id: req
    attributes:
      label: Feature to implement or improve
      description: Describe the feature you want in detail. The more specific the description, the more likely it is to be adopted. You can also provide images and other attachments to help developers understand your idea.
    validations:
      required: true
